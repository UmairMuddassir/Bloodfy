# Free Tier Configuration (No Redis/Worker to avoid costs)
databases:
  - name: bloodify-db
    plan: free

services:
  # Only the Web Service is available on the Free tier
  - type: web
    name: bloodify-api
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn bloodfy_project.wsgi:application
    rootDir: bloodfy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloodify-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
