# Free Tier Configuration
databases:
  - name: bloodify-db
    plan: free

services:
  - type: web
    name: bloodify-api
    runtime: python
    plan: free # Explicitly set free plan to avoid $7/mo charge
    buildCommand: ./build.sh
    startCommand: gunicorn bloodfy_project.wsgi:application
    rootDir: bloodfy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloodify-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
