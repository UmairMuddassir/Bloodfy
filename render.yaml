services:
  # 1. Django Web Service (API)
  - type: web
    name: bloodify-api
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn bloodfy_project.wsgi:application
    rootDir: bloodfy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloodify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bloodify-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"

  # 2. Celery Background Worker
  - type: worker
    name: bloodify-worker
    runtime: python
    buildCommand: ./build.sh
    startCommand: celery -A bloodfy_project worker --loglevel=info
    rootDir: bloodfy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloodify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bloodify-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: bloodify-api
          property: envVar
          envVarKey: SECRET_KEY

  # 3. Redis for Celery Broker
  - type: redis
    name: bloodify-redis
    plan: free
    ipAllowList: []

# 4. Managed PostgreSQL Database
databases:
  - name: bloodify-db
    plan: free
