name: Bloodfy CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  DJANGO_SETTINGS_MODULE: 'bloodfy_project.settings'

jobs:
  # ──────────────────────────────────────────────────────────────────────
  #  Stage 1: Lint & Static Analysis
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./bloodfy
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          pip install -r requirements.txt

      - name: Run flake8
        working-directory: ./bloodfy
        run: flake8 --max-line-length=120 --exclude=venv,migrations,__pycache__ .

      - name: Check formatting (black --check)
        working-directory: ./bloodfy
        run: black --check --line-length=120 --exclude='/(venv|migrations)/' .
        continue-on-error: true  # Advisory only for FYP

  # ──────────────────────────────────────────────────────────────────────
  #  Stage 2: Unit & Integration Tests
  # ──────────────────────────────────────────────────────────────────────
  test:
    name: Django Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: 'ci-cd-test-secret-key-do-not-use-in-production'
      DEBUG: 'True'
      DATABASE_URL: ''
      REDIS_URL: 'redis://localhost:6379/0'
      CELERY_TASK_ALWAYS_EAGER: 'True'
      CELERY_TASK_EAGER_PROPAGATES: 'True'
      # External APIs — leave blank so tests use mocks
      TWILIO_ACCOUNT_SID: ''
      TWILIO_AUTH_TOKEN: ''
      GOOGLE_MAPS_API_KEY: ''
      DIALOGFLOW_PROJECT_ID: ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('bloodfy/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./bloodfy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage redis

      - name: Run migrations
        working-directory: ./bloodfy
        run: |
          python manage.py migrate --verbosity=0

      - name: Run unit tests with coverage
        working-directory: ./bloodfy
        run: |
          coverage run --source='.' manage.py test tests -v 2 --failfast
          coverage report --fail-under=60

      - name: Run triage unit tests
        working-directory: ./bloodfy
        run: python test_triage.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: bloodfy/htmlcov/

  # ──────────────────────────────────────────────────────────────────────
  #  Stage 3: Security Scan
  # ──────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety & bandit
        run: pip install safety bandit

      - name: Check dependencies for vulnerabilities
        working-directory: ./bloodfy
        run: safety check -r requirements.txt
        continue-on-error: true  # Advisory for FYP

      - name: Run bandit security linter
        working-directory: ./bloodfy
        run: bandit -r . -x ./venv,./tests,./migrations -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bloodfy/bandit-report.json
