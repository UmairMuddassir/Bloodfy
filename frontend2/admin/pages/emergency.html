<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloodfy - Emergency Search</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet.js (FREE, no API key needed) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --primary-red: #E53935;
            /* Emergency Red is slightly brighter */
            --primary-red-dark: #C62828;
            --bg-dark-primary: #121212;
            --glass-bg: rgba(25, 25, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --font-family: 'Poppins', sans-serif;
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            display: flex;
            background-color: var(--bg-dark-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            gap: 15px;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-red);
        }

        .sidebar-header .logo {
            height: 45px;
            width: 45px;
            border-radius: 50%;
            border: 2px solid var(--primary-red);
        }

        .sidebar-nav {
            flex-grow: 1;
            padding: 15px 0;
        }

        .sidebar-nav ul li a {
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
            font-size: 1rem;
            padding: 16px 30px;
            margin: 6px 15px;
            border-radius: 10px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .sidebar-nav ul li a i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .sidebar-nav ul li a:hover,
        .sidebar-nav ul li.active a {
            background-color: var(--primary-red);
            color: var(--text-primary);
        }

        .sidebar-footer {
            padding: 30px;
            border-top: 1px solid var(--glass-border);
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .main-content {
            flex-grow: 1;
            width: calc(100% - var(--sidebar-width));
            display: flex;
            flex-direction: column;
        }

        /* --- EMERGENCY SPECIFIC --- */
        /* Map Container (Hero Section) */

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 60vh;
            background-color: #242f3e;
            overflow: hidden;
        }

        #leafletMap {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Dark Overlay on Map for "Tech" feel */

        .map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 18, 18, 0.6);
        }

        /* Floating Search Panel (UC Requirement: Quick Search) */

        .search-panel {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 350px;
            background: rgba(30, 30, 30, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 82, 82, 0.3);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .search-panel h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #FF5252;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .custom-select,
        .custom-input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            font-family: var(--font-family);
        }

        .btn-emergency {
            width: 100%;
            padding: 12px;
            background: #D50000;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(213, 0, 0, 0.5);
            transition: 0.3s;
        }

        .btn-emergency:hover {
            background: #FF1744;
            box-shadow: 0 0 25px rgba(255, 23, 68, 0.6);
        }

        /* Map Markers (Visual) */

        .map-marker {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(229, 57, 53, 0.2);
            border: 2px solid #E53935;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #E53935;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        .map-marker i {
            font-size: 1.2rem;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.4);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(229, 57, 53, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(229, 57, 53, 0);
            }
        }

        /* Results Section (Bottom Half) */

        .results-section {
            flex-grow: 1;
            padding: 30px 40px;
            background: var(--bg-dark-primary);
            border-top: 1px solid var(--glass-border);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            align-items: center;
        }

        .donor-result-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-dark-secondary);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .donor-result-card:hover {
            border-color: var(--primary-red);
            transform: translateX(5px);
        }

        .donor-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .donor-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--primary-red);
            border: 2px solid var(--glass-border);
        }

        .dist-badge {
            background: rgba(41, 98, 255, 0.15);
            color: #2962FF;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 5px;
            display: inline-block;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-call {
            background: #00C853;
        }

        .btn-call:hover {
            background: #00E676;
            box-shadow: 0 0 10px rgba(0, 200, 83, 0.4);
        }

        .btn-sms {
            background: #2962FF;
        }

        .btn-sms:hover {
            background: #448AFF;
            box-shadow: 0 0 10px rgba(41, 98, 255, 0.4);
        }
    </style>
</head>

<body>

        <div class="sidebar-header">

        </div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html"><i class="fa-solid fa-table-columns"></i> Dashboard</a></li>
                <li><a href="donor.html"><i class="fa-solid fa-users"></i> Donors</a></li>
                <li><a href="patient.html"><i class="fa-solid fa-procedures"></i> Blood Requests</a></li>
                <li><a href="bloodstock.html"><i class="fa-solid fa-vials"></i> Blood Stock</a></li>
                <li><a href="staff.html"><i class="fa-solid fa-user-tie"></i> Staff</a></li>

                <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>

    <div class="main-content">

        <div class="map-wrapper">
            <div id="leafletMap"></div>

                <form id="emergencySearchForm">

        <div class="results-section">

    <!-- API Configuration -->
    <script src="../../config/api-config.js"></script>

    <!-- Emergency Search Script -->
    <script src="../../js/emergency.js"></script>

    <!-- Leaflet Map Init -->
    <script>
        // Pakistani city center coordinates
        const CITY_COORDS = {
            'lahore':     [31.5204, 74.3587],
            'karachi':    [24.8607, 67.0011],
            'islamabad':  [33.6844, 73.0479],
            'rawalpindi': [33.5651, 73.0169],
            'faisalabad': [31.4504, 73.1350],
            'multan':     [30.1978, 71.4711],
            'peshawar':   [34.0151, 71.5249],
            'quetta':     [30.1798, 66.9750],
            'default':    [31.5204, 74.3587]
        };

        let map = null;
        let donorMarkers = [];
        let hospitalMarker = null;

        // Custom icons
        const hospitalIcon = L.divIcon({
            html: '<div style="background:#E53935;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 0 15px rgba(229,57,53,0.7);animation:pulse 2s infinite;"><i class="fa-solid fa-hospital" style="color:white;font-size:16px;"></i></div>',
            className: '',
            iconSize: [38, 38],
            iconAnchor: [19, 19]
        });

        function getDonorIcon(rank) {
            const colors = ['#00C853','#4CAF50','#8BC34A','#CDDC39','#FFC107','#FF9800','#FF5722'];
            const color = colors[Math.min(rank - 1, colors.length - 1)];
            return L.divIcon({
                html: `<div style="background:${color};border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:2px solid white;box-shadow:0 0 10px ${color}80;font-weight:700;color:white;font-size:13px;">${rank}</div>`,
                className: '',
                iconSize: [34, 34],
                iconAnchor: [17, 17]
            });
        }

        function initLeafletMap(city) {
            const cityKey = (city || 'lahore').toLowerCase();
            const center = CITY_COORDS[cityKey] || CITY_COORDS['default'];

            if (!map) {
                map = L.map('leafletMap', {
                    center: center,
                    zoom: 13,
                    zoomControl: true
                });

                // Dark tile layer (free)
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
                    subdomains: 'abcd',
                    maxZoom: 19
                }).addTo(map);
            } else {
                map.setView(center, 13);
            }

            // Place hospital marker at city center
            if (hospitalMarker) hospitalMarker.remove();
            hospitalMarker = L.marker(center, { icon: hospitalIcon })
                .addTo(map)
                .bindPopup('<b style="color:#E53935;">📍 Hospital / Request Location</b>')
                .openPopup();

            return center;
        }

        function plotDonorsOnMap(donors, hospitalCenter) {
            // Remove old markers
            donorMarkers.forEach(m => m.remove());
            donorMarkers = [];

            donors.forEach((donor, index) => {
                const rank = index + 1;
                let lat, lon;

                if (donor.latitude && donor.longitude) {
                    lat = donor.latitude;
                    lon = donor.longitude;
                } else {
                    // Scatter around city center if no coords
                    const angle = (index / donors.length) * 2 * Math.PI;
                    const spread = 0.02 + (index * 0.008);
                    lat = hospitalCenter[0] + spread * Math.sin(angle);
                    lon = hospitalCenter[1] + spread * Math.cos(angle);
                }

                const distText = donor.distance ? `${donor.distance} km away` : `~${(1 + index * 0.5).toFixed(1)} km (est.)`;
                const etaText = donor.eta_minutes ? `~${donor.eta_minutes} min ETA` : `~${5 + index * 3} min ETA`;

                const marker = L.marker([lat, lon], { icon: getDonorIcon(rank) })
                    .addTo(map)
                    .bindPopup(`
                        <div style="font-family:Poppins,sans-serif;min-width:180px;">
                            <b style="color:#E53935;font-size:1rem;">#${rank} ${donor.name}</b><br>
                            <span style="color:#888;">🩸 ${donor.blood_group}</span><br>
                            <span style="color:#2962FF;">📍 ${distText}</span><br>
                            <span style="color:#00C853;">⏱ ${etaText}</span>
                        </div>
                    `);

                // Draw line from hospital to donor
                L.polyline([hospitalCenter, [lat, lon]], {
                    color: rank === 1 ? '#00C853' : '#555',
                    weight: rank === 1 ? 2.5 : 1.5,
                    dashArray: rank === 1 ? null : '5,8',
                    opacity: 0.7
                }).addTo(map);

                donorMarkers.push(marker);
            });

            // Fit map to show all markers
            if (donorMarkers.length > 0) {
                const allPoints = [[hospitalCenter[0], hospitalCenter[1]], ...donors.map((d, i) => {
                    const m = donorMarkers[i];
                    const latlng = m.getLatLng();
                    return [latlng.lat, latlng.lng];
                })];
                map.fitBounds(allPoints, { padding: [40, 40] });
            }
        }

        // Make available globally for emergency.js
        window.initLeafletMap = initLeafletMap;
        window.plotDonorsOnMap = plotDonorsOnMap;

        // Initialize map on page load
        document.addEventListener('DOMContentLoaded', () => {
            initLeafletMap('lahore');
        });
    </script>

</body>
